<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="author" content="星火" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理后台 · IT认证练习</title>
  <link rel="stylesheet" href="styles.css?v=202611111943" />
  <script src="js/account-config.js?v=202611111943"></script>
  <script src="js/supabase-config.js?v=202611111943"></script>

</head>
<body class="admin-page">
  <div class="admin-wrap">
    <div class="admin-chrome">
      <header class="admin-topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">IT</div>
          <div>
            <h1>
              <span class="title-full">IT认证练习 · 管理后台</span>
              <span class="title-short">管理后台</span>
            </h1>
            <div id="admin-who" class="sub muted small"></div>
          </div>
        </div>
        <div class="admin-top-actions">
          <a class="btn btn-sm btn-ghost" href="index.html"><span class="act-full">← 返回练习站</span><span class="act-short">返回</span></a>
          <button type="button" class="btn btn-sm" id="btn-refresh"><span class="act-full">刷新列表</span><span class="act-short">刷新</span></button>
        </div>
      </header>
      <div class="admin-tabs" role="tablist">
        <button type="button" class="admin-tab active" data-tab="users" aria-label="学员列表">
          <span class="tab-full">学员列表</span><span class="tab-short">学员</span>
        </button>
        <button type="button" class="admin-tab" data-tab="create" aria-label="开号">
          <span class="tab-full">开号</span><span class="tab-short">开号</span>
        </button>
        <button type="button" class="admin-tab" data-tab="reports" aria-label="报错列表">
          <span class="tab-full">报错列表</span><span class="tab-short">报错</span>
        </button>
        <!-- PDF 导入暂停 2026-11-10，恢复时取消注释 -->
        <!--
        <button type="button" class="admin-tab" data-tab="pdf" aria-label="导入PDF题库">
          <span class="tab-full">导入PDF题库</span><span class="tab-short">导入</span>
        </button>
        -->
      </div>
    </div>
    <div id="admin-msg" class="admin-msg" role="status"></div>
    <div id="admin-gate" class="gate card hidden">
      <p id="gate-text">正在校验管理员身份…</p>
      <p><a class="btn btn-sm btn-primary" href="index.html">返回首页登录</a></p>
    </div>
    <div id="admin-app" class="hidden">
      <section id="tab-users" class="admin-panel active card">
        <h2>学员列表</h2>
        <div class="admin-table-wrap admin-users-table">
          <table class="admin-table" id="users-table">
            <thead>
              <tr>
                <th>账号</th><th>状态</th><th>到期</th><th>题库</th><th>设备上限</th><th>最近登录</th><th>创建</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
        <div class="admin-user-cards" id="users-cards"></div>
      </section>
      <section id="tab-create" class="admin-panel card">
        <h2>开号</h2>
        <form id="create-form" class="admin-form">
          <label>用户名（可空，空则自动 userN）
            <input type="text" id="c-user" placeholder="如 zhangsan" autocomplete="off" />
          </label>
          <label>天数（默认 30）
            <input type="number" id="c-days" min="1" value="30" />
          </label>
          <label>设备上限（默认 2，0=不限）
            <input type="number" id="c-max" min="0" value="2" />
          </label>
          <div>
            <div class="admin-fieldset-label">可见题库</div>
            <div class="exam-checks" id="c-exams">
              <label><input type="checkbox" value="ai103" checked /> ai103</label>
              <label><input type="checkbox" value="dop-c02" /> dop-c02</label>
              <label><input type="checkbox" value="dp-700" /> dp-700</label>
              <label><input type="checkbox" value="dp-420" /> dp-420</label>
              <label><input type="checkbox" value="az305" /> AZ-305</label>
              <label><input type="checkbox" value="*" id="c-all" /> 全部 (*)</label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">创建账号</button>
        </form>
        <div id="create-pw" class="pw-box hidden"></div>
      </section>
      <section id="tab-reports" class="admin-panel card">
        <h2>报错列表</h2>
        <p class="muted small">来自学员练习页「报错」；登录后会写入云端。</p>
        <div class="admin-reports-toolbar">
          <div class="admin-seg" role="tablist" aria-label="报错筛选" id="reports-filter">
            <button type="button" class="admin-seg-btn active" data-report-filter="open" aria-selected="true">未处理</button>
            <button type="button" class="admin-seg-btn" data-report-filter="all" aria-selected="false">全部</button>
          </div>
        </div>
        <div class="admin-table-wrap admin-reports-table">
          <table class="admin-table">
            <thead>
              <tr><th>时间</th><th>账号</th><th>题库</th><th>题号</th><th>说明</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="reports-body"></tbody>
          </table>
        </div>
        <div class="admin-report-cards" id="reports-cards"></div>
      </section>

      -->
    </div>
    <p class="muted small admin-foot">作者：星火 · 管理权限由服务端校验</p>
  </div>
  <div id="admin-overlay" class="admin-overlay hidden" hidden>
    <div class="admin-overlay-backdrop" data-sheet-dismiss="1"></div>
    <div id="admin-sheet" class="admin-sheet" role="dialog" aria-modal="true" aria-labelledby="admin-sheet-title">
      <div class="admin-sheet-handle" aria-hidden="true"></div>
      <h3 id="admin-sheet-title"></h3>
      <p id="admin-sheet-desc" class="muted small"></p>
      <div id="admin-sheet-body" class="admin-form"></div>
      <div class="admin-sheet-actions">
        <button type="button" class="btn" id="admin-sheet-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="admin-sheet-ok">确定</button>
      </div>
    </div>
  </div>
  <script src="js/issue-report.js?v=202611111943"></script>
  <script src="js/admin.js?v=202611111943"></script>
